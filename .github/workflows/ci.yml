name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`: the lockfile is committed from a Windows
      # machine and npm resolves platform-specific optional deps (sharp's
      # wasm/linux variants) only for the host OS, so `npm ci` fails on Ubuntu
      # with "Missing: @emnapi/... from lock file". `npm install` still honours
      # pinned versions and heals the platform delta. Contributors on any OS
      # get a green build either way.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (game math)
        run: npm test

      # Builds with no API keys set — proves the deterministic fallbacks
      # (local question bank + procedural sprites) keep the app standalone.
      - name: Production build
        run: npm run build
